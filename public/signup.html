<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Signup - CropGuard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section class="upload-section" style="min-height:100vh; display:flex; align-items:center;">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-5">
                    <div class="upload-card">
                        <h3 class="text-center mb-4"><i class="fas fa-leaf"></i> CropGuard Signup</h3>
                        <form id="signupForm">
                            <div class="mb-3">
                                <input type="text" id="name" class="form-control" placeholder="Name" required>
                            </div>
                            <div class="mb-3">
                                <input type="email" id="email" class="form-control" placeholder="Email" required>
                            </div>
                            <div class="mb-3">
                                <input type="password" id="password" class="form-control" placeholder="Password" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Signup</button>
                            <p id="errorMsg" class="text-danger text-center mt-3"></p>
                        </form>
                        <p class="text-center mt-3">Already account hai? <a href="login.html">Login karo</a></p>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script>
        document.getElementById("signupForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const name = document.getElementById("name").value;
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            const errorMsg = document.getElementById("errorMsg");

            try {
                const res = await fetch("http://localhost:5000/api/auth/signup", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ name, email, password })
                });

                const data = await res.json();

                if (res.ok) {
                    alert("Signup successful! Ab login karo.");
                    window.location.href = "login.html";
                } else {
                    errorMsg.textContent = data.message || "Signup failed";
                }
            } catch (err) {
                errorMsg.textContent = "Server error, try again";
            }
        });
    </script>
</body>
</html>
